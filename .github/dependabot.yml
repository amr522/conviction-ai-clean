version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    reviewers:
      - "conviction-ai-team"
    assignees:
      - "conviction-ai-team"
    commit-message:
      prefix: "deps"
      include: "scope"
  
  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "conviction-ai-team"
    assignees:
      - "conviction-ai-team"
    commit-message:
      prefix: "ci"
      include: "scope"