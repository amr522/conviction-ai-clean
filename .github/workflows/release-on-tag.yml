name: Release on Tag

on:
  push:
    tags:
      - 'v*.*.*'  # semver tags

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: conviction-ai-pipeline

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install test dependencies
        run: scripts/install-test-deps.sh
        
      - name: Run all validations
        run: ./scripts/run-all-validations.sh
        
      - name: Run benchmarks
        run: |
          pytest tests/test_benchmarks.py --benchmark-only --benchmark-save=release
        
  build-and-publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      
    steps:
      - uses: actions/checkout@v3
      
      - name: Get tag version
        id: tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.VERSION }}
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.10.0'
          
      - name: Package Helm chart
        run: |
          helm package charts/conviction-ai-pipeline \
            --version ${{ steps.tag.outputs.VERSION }} \
            --app-version ${{ steps.tag.outputs.VERSION }}
            
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.VERSION }}
          name: Release ${{ steps.tag.outputs.VERSION }}
          body: |
            ## Release ${{ steps.tag.outputs.VERSION }}
            
            ### Docker Image
            ```bash
            docker pull ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.VERSION }}
            ```
            
            ### Helm Chart
            ```bash
            helm upgrade conviction-ai-pipeline ./conviction-ai-pipeline-${{ steps.tag.outputs.VERSION }}.tgz
            ```
            
            ### Changes
            See [CHANGELOG.md](CHANGELOG.md) for detailed changes.
          files: |
            conviction-ai-pipeline-${{ steps.tag.outputs.VERSION }}.tgz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}