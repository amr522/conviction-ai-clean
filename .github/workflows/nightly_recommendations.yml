name: Nightly Strategy Recommendations

on:
  schedule:
    # Run at 15:00 UTC daily (11:00 ET during standard time, 10:00 ET during daylight time)
    - cron: '0 15 * * *'
  workflow_dispatch:  # Allow manual triggering for testing

jobs:
  generate-recommendations:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Generate strategy recommendations
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
        POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      run: |
        # Get current date in UTC
        CURRENT_DATE=$(date -u +'%Y-%m-%d')
        echo "Generating recommendations for date: $CURRENT_DATE"
        
        # Run strategy selector
        python strategy_selector.py --date $CURRENT_DATE
        
    - name: Upload recommendations artifact
      uses: actions/upload-artifact@v3
      with:
        name: strategy-recommendations-${{ github.run_number }}
        path: |
          strategy_recs.json
          *.log
        retention-days: 30
        
    - name: Create summary
      run: |
        echo "## Strategy Recommendations Generated" >> $GITHUB_STEP_SUMMARY
        echo "**Date:** $(date -u +'%Y-%m-%d %H:%M:%S') UTC" >> $GITHUB_STEP_SUMMARY
        echo "**Workflow Run:** ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
        
        if [ -f strategy_recs.json ]; then
          echo "**Status:** ✅ Success" >> $GITHUB_STEP_SUMMARY
          echo "**Output File:** strategy_recs.json" >> $GITHUB_STEP_SUMMARY
          
          # Show file size and preview
          echo "**File Size:** $(ls -lh strategy_recs.json | awk '{print $5}')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Preview:**" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          head -20 strategy_recs.json >> $GITHUB_STEP_SUMMARY || echo "Empty or no recommendations" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        else
          echo "**Status:** ❌ Failed - No output file generated" >> $GITHUB_STEP_SUMMARY
        fi
