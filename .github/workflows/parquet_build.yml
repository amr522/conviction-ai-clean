name: Parquet Build Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - 'config/data_pipeline.yaml'

jobs:
  dry_run:
    name: Dry Run Validation
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyspark>=3.4.0  # For ETL scripts using SparkSession
    
    - name: Run dry-run validation
      run: make dry-run-parquet
    
    - name: Archive dry-run logs
      uses: actions/upload-artifact@v3
      with:
        name: dry-run-logs
        path: logs/dry-run.log
        retention-days: 7

  build_publish:
    name: Build and Publish
    needs: dry_run
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyspark>=3.4.0  # For ETL scripts using SparkSession
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1  # Adjust if needed
    
    - name: Build and publish Parquet
      run: make build-and-publish-parquet
    
    - name: Archive build logs
      uses: actions/upload-artifact@v3
      with:
        name: build-logs
        path: logs/build.log
        retention-days: 7
    
    - name: Archive Parquet file
      uses: actions/upload-artifact@v3
      with:
        name: training-data-parquet
        path: data/processed/full/training_data_final.parquet
        retention-days: 7
