name: Publish Release

# Trigger on push of any Git tag matching v*.*.*
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-publish:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch all history for proper changelog generation

      # Step 2: Set up Python environment
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest build twine wheel

      # Step 4: Run tests to ensure everything is working
      - name: Run tests
        run: |
          pytest tests/

      # Step 5: Build package distributions (sdist and wheel)
      - name: Build package
        run: |
          python -m build --sdist --wheel
          ls -l dist/

      # Step 6: Upload built packages as artifacts
      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: dist
          path: dist/

      # Step 7: Extract version from tag (without 'v' prefix)
      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      # Step 8: Extract changelog section for the current version
      - name: Extract changelog section
        run: |
          # Create a pattern to extract content between current version header and the next header
          VERSION_HEADER="## \[${VERSION}\]"
          NEXT_VERSION_PATTERN="## \["
          
          # Use awk to extract the changelog section
          awk -v version="$VERSION_HEADER" -v next_pattern="$NEXT_VERSION_PATTERN" '
            BEGIN { found=0; }
            $0 ~ version { found=1; print; next; }
            found && $0 ~ next_pattern { found=0; exit; }
            found { print }
          ' CHANGELOG.md > release_notes.md
          
          # If no next version header was found, extract until end of file
          if [ ! -s release_notes.md ]; then
            awk -v version="$VERSION_HEADER" '
              BEGIN { found=0; }
              $0 ~ version { found=1; print; next; }
              found { print }
            ' CHANGELOG.md > release_notes.md
          fi
          
          # Display extracted content for debugging
          echo "Extracted release notes:"
          cat release_notes.md

      # Step 9: Publish package to PyPI
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.4.2
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip_existing: true
          verbose: true

      # Step 10: Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: "Conviction-AI v${VERSION}"
          body_path: release_notes.md
          files: |
            dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 11: Send Slack notification (optional, only runs on success)
      - name: Notify Slack
        if: success()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "attachments": [
                {
                  "color": "#36a64f",
                  "pretext": "🚀 *New Release Published!*",
                  "title": "Conviction-AI v${VERSION}",
                  "title_link": "${{ github.event.repository.html_url }}/releases/tag/v${VERSION}",
                  "text": "Successfully published to PyPI and GitHub Releases.",
                  "footer": "GitHub Actions",
                  "footer_icon": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
                  "ts": "${{ github.event.repository.updated_at }}"
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
