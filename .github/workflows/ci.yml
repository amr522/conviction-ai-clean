name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  parallel-validations:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        validation: [schema-validation, feature-smoke-test, feature-validation, calculate-features-test, train-cli-test, performance-utils-test, feature-parquet-test, training-dataset-test, explainability-test]
    
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
    - name: Run validation
      run: scripts/run-${{ matrix.validation }}.sh

  test:
    runs-on: ubuntu-latest
    needs: [parallel-validations]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install nbconvert papermill

    - name: Run all tests
      run: |
        pytest tests/ --disable-warnings -q

    - name: Execute tutorial notebook in dry mode
      run: |
        papermill Autopilot_V2_TimeSeries_Split_Tutorial.ipynb \
                 /tmp/out.ipynb \
                 -p run_autopilot False

    - name: Upload notebook run artifact
      uses: actions/upload-artifact@v4
      with:
        name: notebook-run-result
        path: /tmp/out.ipynb
        retention-days: 7

  benchmarks:
    runs-on: ubuntu-latest
    needs: [parallel-validations]
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install test dependencies
        run: scripts/install-test-deps.sh
      - name: Create benchmarks directory
        run: mkdir -p benchmarks
      - name: Run benchmarks
        run: pytest tests/test_benchmarks.py --benchmark-only --benchmark-storage=benchmarks --benchmark-save
      - name: Compare benchmarks
        run: |
          if [ -f benchmarks/.benchmarks.json ]; then
            pytest tests/test_benchmarks.py --benchmark-only --benchmark-storage=benchmarks --benchmark-compare --benchmark-compare-fail=mean:10%
          else
            echo "No baseline benchmarks found, skipping comparison"
          fi
      - name: Upload benchmark results
        uses: actions/upload-artifact@v3
        with:
          name: benchmark-results
          path: benchmarks/

  autoscaling-validate:
    runs-on: ubuntu-latest
    needs: [parallel-validations]
    steps:
      - uses: actions/checkout@v3
      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.10.0'
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
      - name: Validate autoscaling templates
        run: scripts/validate-autoscaling-yaml.sh
      - name: Validate OIDC templates
        run: scripts/validate-oidc.sh

  data-drift-check:
    runs-on: ubuntu-latest
    needs: [parallel-validations]
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install test dependencies
        run: |
          pip install evidently pandas prometheus-client
      - name: Create baseline features
        run: |
          python -c "
          import pandas as pd
          import numpy as np
          from datetime import date
          
          # Create baseline features
          np.random.seed(42)
          baseline = pd.DataFrame({
              'date': [date(2025, 1, 1)] * 1000,
              'ticker': ['AAPL'] * 1000,
              'feature1': np.random.normal(0, 1, 1000),
              'feature2': np.random.normal(5, 2, 1000),
              'feature3': np.random.exponential(1, 1000)
          })
          baseline.to_parquet('data/Parquet_data/features_baseline.parquet')
          
          # Create current features (with slight drift)
          current = pd.DataFrame({
              'date': [date(2025, 1, 2)] * 1000,
              'ticker': ['AAPL'] * 1000,
              'feature1': np.random.normal(0.05, 1, 1000),  # slight mean shift
              'feature2': np.random.normal(5, 2, 1000),
              'feature3': np.random.exponential(1, 1000)
          })
          current.to_parquet('data/Parquet_data/features_current.parquet')
          print('✅ Test datasets created')
          "
      - name: Run drift detection
        run: |
          python src/check_data_drift.py \
            --reference data/Parquet_data/features_baseline.parquet \
            --current data/Parquet_data/features_current.parquet \
            --drift-enabled true \
            --drift-threshold 0.2 \
            --drift-report-json drift.json
      - name: Export drift metrics (mock)
        run: |
          echo "Would export to Pushgateway: ${{ secrets.PUSHGATEWAY_URL || 'http://pushgateway:9091' }}"
          python src/export_drift_metrics.py \
            --json drift.json \
            --pushgateway-url "${{ secrets.PUSHGATEWAY_URL || 'http://pushgateway:9091' }}" || echo "Pushgateway not available in CI"

  smoke-test-staging:
    runs-on: ubuntu-latest
    needs: [benchmarks]
    steps:
      - uses: actions/checkout@v3
      - name: Set up Docker & Kind
        uses: engineerd/setup-kind@v0.5.0
      - name: Build Docker image
        run: docker build -t conviction-ai-pipeline:latest .
      - name: Run staging smoke test
        run: scripts/smoke-test-staging.sh

  verify-phase1:
    runs-on: ubuntu-latest
    needs: [benchmarks]
    steps:
      - uses: actions/checkout@v3
      - name: Run Phase 1 Verification
        run: scripts/verify-phase1.sh

  signal-validators:
    runs-on: ubuntu-latest
    needs: [verify-phase1]
    steps:
      - uses: actions/checkout@v3
      - name: Install test deps
        run: scripts/install-test-deps.sh
      - name: Create test data with anomalies
        run: |
          mkdir -p data/Parquet_data
          python -c "
          import polars as pl
          import numpy as np
          from datetime import date
          
          # Create test data with signal quality metrics
          np.random.seed(42)
          df = pl.DataFrame({
              'date': [str(date(2025, 1, 1))] * 100,
              'ticker': ['AAPL'] * 100,
              'opt30_net_gamma': [0.05] * 90 + [None] * 10,  # 90% coverage
              'opt30_flow_divergence': np.random.normal(0, 100, 100),
              'opt30_close': np.random.normal(150, 10, 100),
              'opt30_vol_spike': [True] * 10 + [False] * 90,
              'true_spike': [True] * 8 + [False] * 92  # 80% detection rate
          })
          df.write_parquet('data/Parquet_data/options_30min_test.parquet')
          print('✅ Test signal data created')
          "
      - name: Run signal quality validators
        run: |
          ./src/validate_signals.py \
            --input data/Parquet_data/options_30min_test.parquet \
            --output-json signal_results.json \
            --threshold 0.8

  anomaly-injection-test:
    runs-on: ubuntu-latest
    needs: [signal-validators]
    steps:
      - uses: actions/checkout@v3
      - name: Install test dependencies
        run: scripts/install-test-deps.sh
      - name: Inject synthetic anomalies
        run: scripts/inject-synthetic-anomalies.sh ${{ github.event.date || github.run_attempt }}
      - name: Re-run signal validators at low threshold
        run: |
          ./src/validate_signals.py \
            --input data/Parquet_data/options_30min_clean_$(date -v-1d +%Y-%m-%d).parquet \
            --output-json anomaly_results.json \
            --threshold 0.1

  schema-registry-validation:
    runs-on: ubuntu-latest
    needs: [anomaly-injection-test]
    steps:
      - uses: actions/checkout@v3
      - name: Install fastjsonschema
        run: pip install fastjsonschema
      - name: Validate feature schema
        run: |
          ./src/validate_schema_registry.py \
            --feature-parquet data/Parquet_data/daily_master.parquet \
            --schema schemas/feature_schema.json

  schema-registry-register:
    runs-on: ubuntu-latest
    needs: [schema-registry-validation]
    steps:
      - uses: actions/checkout@v3
      - name: Register schema in AWS Glue
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
        run: |
          pip install boto3
          ./src/register_schema.py

  validate-signal-alerts:
    runs-on: ubuntu-latest
    needs: [schema-registry-register]
    steps:
      - uses: actions/checkout@v3
      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.10.0'
      - name: Render Helm templates
        run: |
          helm template conviction-ai-pipeline charts/conviction-ai-pipeline \
            --set signalValidation.enabled=true \
            --set alerts.enabled=true \
            --set signalValidation.threshold=0.9 \
            > rendered.yaml
      - name: Check PrometheusRule exists
        run: grep -q "kind: PrometheusRule" rendered.yaml
      - name: Check GammaCoverageLow alert
        run: grep -q "GammaCoverageLow" rendered.yaml

  validate-anomaly-cronjob:
    runs-on: ubuntu-latest
    needs: [validate-signal-alerts]
    steps:
      - uses: actions/checkout@v3
      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.10.0'
      - name: Render CronJob template
        run: |
          helm template conviction-ai-pipeline charts/conviction-ai-pipeline \
            --set anomalyCron.enabled=true \
            --set anomalyCron.schedule="0 */6 * * *" \
            --set signalValidation.lowerThreshold=0.1 \
            > rendered-cron.yaml
      - name: Check CronJob exists
        run: grep -q "kind: CronJob" rendered-cron.yaml
      - name: Check anomaly-test name
        run: grep -q "anomaly-test" rendered-cron.yaml

  validate-anomaly-alerts:
    runs-on: ubuntu-latest
    needs: [validate-anomaly-cronjob]
    steps:
      - uses: actions/checkout@v3
      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.10.0'
      - name: Render alerts and dashboard
        run: |
          helm template conviction-ai-pipeline charts/conviction-ai-pipeline \
            --set anomalyCron.enabled=true \
            --set alerts.enabled=true \
            --set grafana.dashboard.anomalies.enabled=true \
            --set signalValidation.lowerThreshold=0.1 \
            > rendered-anomaly.yaml
      - name: Check Anomalies Dashboard
        run: grep -q "anomalies-dashboard" rendered-anomaly.yaml
      - name: Check AnomalyTestFailed alert
        run: grep -q "AnomalyTestFailed" rendered-anomaly.yaml

  incident-report:
    runs-on: ubuntu-latest
    if: failure() && contains(needs.*.result, 'failure')
    needs: [validate-anomaly-alerts]
    steps:
      - uses: actions/checkout@v3
      - name: Generate incident report
        run: scripts/generate-incident-report.sh AnomalyTestFailed
      - name: Upload report artifact
        uses: actions/upload-artifact@v3
        with:
          name: incident-report
          path: reports/*.md

  advanced-signal-validation:
    runs-on: ubuntu-latest
    needs: [validate-anomaly-alerts]
    steps:
      - uses: actions/checkout@v3
      - name: Install test deps
        run: scripts/install-test-deps.sh
      - name: Create test data
        run: |
          mkdir -p data/Parquet_data
          python -c "
          import polars as pl
          from datetime import date
          
          # Create test options data
          df = pl.DataFrame({
              'ticker': ['AAPL'] * 100,
              'timestamp': list(range(100)),
              'opt30_net_gamma': [1.0] * 90 + [None] * 10,
              'opt30_flow_divergence': [1.0] * 50 + [-1.0] * 50,
              'opt30_mid_price': list(range(100, 200)),
              'opt30_volume': [100] * 100,
              'opt30_vol_mean_5': [50] * 100,
              'opt30_vol_std_5': [10] * 100,
              'opt30_vol_spike': [True] * 20 + [False] * 80
          })
          df.write_parquet('data/Parquet_data/options_30min_clean_$(date +%F).parquet')
          print('✅ Test data created')
          "
      - name: Run advanced signal validation
        run: |
          chmod +x src/validate_advanced_signals.py
          ./src/validate_advanced_signals.py \
            --input data/Parquet_data/options_30min_clean_$(date +%F).parquet \
            --threshold 0.8 \
            --output-json advanced_results.json

  schema-registry-validation:
    runs-on: ubuntu-latest
    needs: [advanced-signal-validation]
    steps:
      - uses: actions/checkout@v3
      - name: Install test deps
        run: scripts/install-test-deps.sh
      - name: Install fastjsonschema
        run: pip install fastjsonschema
      - name: Create test feature data
        run: |
          mkdir -p data/Parquet_data
          python -c "
          import polars as pl
          from datetime import date
          
          df = pl.DataFrame({
              'date': [str(date(2025, 1, 1))] * 10,
              'ticker': ['AAPL'] * 10,
              'fred_fed_funds_rate': [5.25] * 10,
              'vix_index': [20.5] * 10,
              'opt30_call_flow': [1000.0] * 10,
              'opt30_put_flow': [800.0] * 10,
              'opt30_flow_divergence': [200.0] * 10,
              'opt30_net_gamma': [0.05] * 10,
              'opt30_gamma_squeeze': [False] * 10,
              'vol_zscore': [0.1] * 10,
              'stockd_return_1d': [0.02] * 10,
              'optd_iv30': [0.25] * 10,
              'optd_volume': [50000] * 10
          })
          df.write_parquet('data/Parquet_data/features_test.parquet')
          print('✅ Test feature data created')
          "
      - name: Validate feature schema
        run: |
          ./src/validate_schema_registry.py \
            --parquet data/Parquet_data/features_test.parquet \
            --schema schemas/feature_schema.json

  schema-registry-register:
    runs-on: ubuntu-latest
    needs: [schema-registry-validation]
    steps:
      - uses: actions/checkout@v3
      - name: Install boto3
        run: pip install boto3
      - name: Register schema in AWS Glue
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
        run: ./src/register_schema.py

  performance-utils-extra-test:
    runs-on: ubuntu-latest
    needs: [advanced-signal-validation]
    steps:
      - uses: actions/checkout@v3
      - name: Install test deps
        run: scripts/install-test-deps.sh
      - name: Run extra performance utils tests
        run: pytest tests/test_performance_utils_extra.py -v

  canary-test:
    runs-on: ubuntu-latest
    needs: [schema-registry-register]
    steps:
      - uses: actions/checkout@v3
      - name: Setup kubectl & Argo Rollouts
        run: |
          curl -sLO https://github.com/argoproj/argo-rollouts/releases/latest/download/kubectl-argo-rollouts-linux-amd64
          sudo mv kubectl-argo-rollouts-linux-amd64 /usr/local/bin/kubectl-argo-rollouts
          sudo chmod +x /usr/local/bin/kubectl-argo-rollouts
      - name: Run canary smoke test
        run: scripts/run-canary-test.sh

  coverage:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install test dependencies
        run: scripts/install-test-deps.sh
      - name: Run tests with coverage
        run: coverage run -m pytest
      - name: Generate coverage report
        run: coverage report --fail-under=80
      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage.xml
      - name: Upload to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: coverage.xml
