name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install nbconvert papermill

    - name: Run tests
      run: |
        pytest tests/ --disable-warnings -q

    - name: Execute tutorial notebook in dry mode
      run: |
        papermill Autopilot_V2_TimeSeries_Split_Tutorial.ipynb \
                 /tmp/out.ipynb \
                 -p run_autopilot False

    - name: Upload notebook run artifact
      uses: actions/upload-artifact@v4
      with:
        name: notebook-run-result
        path: /tmp/out.ipynb
        retention-days: 7

  coverage:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install test dependencies
        run: scripts/install-test-deps.sh
      - name: Run tests with coverage
        run: coverage run -m pytest
      - name: Generate coverage report
        run: coverage report --fail-under=80
      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage.xml
      - name: Upload to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: coverage.xml
