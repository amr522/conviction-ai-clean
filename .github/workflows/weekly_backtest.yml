name: Weekly Backtest Analysis

on:
  schedule:
    # Run at 22:00 UTC every Monday (18:00 ET during standard time, 17:00 ET during daylight time)
    - cron: '0 22 * * MON'
  workflow_dispatch:  # Allow manual triggering for testing

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Calculate backtest date range
      id: dates
      run: |
        # Calculate last Monday (end date) and the Monday before that (start date)
        LAST_MONDAY=$(date -u -d 'last monday' +'%Y-%m-%d')
        START_DATE=$(date -u -d "$LAST_MONDAY - 7 days" +'%Y-%m-%d')
        
        echo "start_date=$START_DATE" >> $GITHUB_OUTPUT
        echo "end_date=$LAST_MONDAY" >> $GITHUB_OUTPUT
        
        echo "Backtest period: $START_DATE to $LAST_MONDAY"
        
    - name: Run weekly backtest
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
        POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      run: |
        echo "Running backtest from ${{ steps.dates.outputs.start_date }} to ${{ steps.dates.outputs.end_date }}"
        
        # Run backtest harness
        python backtest_harness.py --start ${{ steps.dates.outputs.start_date }} --end ${{ steps.dates.outputs.end_date }}
        
    - name: Upload backtest artifacts
      uses: actions/upload-artifact@v3
      with:
        name: weekly-backtest-${{ github.run_number }}
        path: |
          backtest_*.json
          backtest_*.csv
          *.log
        retention-days: 90
        
    - name: Create backtest summary
      run: |
        echo "## Weekly Backtest Analysis" >> $GITHUB_STEP_SUMMARY
        echo "**Period:** ${{ steps.dates.outputs.start_date }} to ${{ steps.dates.outputs.end_date }}" >> $GITHUB_STEP_SUMMARY
        echo "**Execution Date:** $(date -u +'%Y-%m-%d %H:%M:%S') UTC" >> $GITHUB_STEP_SUMMARY
        echo "**Workflow Run:** ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Check for output files and show results
        if ls backtest_*.json 1> /dev/null 2>&1; then
          echo "**Status:** ✅ Success" >> $GITHUB_STEP_SUMMARY
          echo "**Generated Files:**" >> $GITHUB_STEP_SUMMARY
          for file in backtest_*.json backtest_*.csv; do
            if [ -f "$file" ]; then
              echo "- $file ($(ls -lh "$file" | awk '{print $5}'))" >> $GITHUB_STEP_SUMMARY
            fi
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Backtest Results Preview:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          # Show results from the most recent backtest file
          LATEST_RESULT=$(ls -t backtest_*.json 2>/dev/null | head -n1)
          if [ -n "$LATEST_RESULT" ]; then
            head -50 "$LATEST_RESULT" >> $GITHUB_STEP_SUMMARY || echo "No results to preview" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo '```' >> $GITHUB_STEP_SUMMARY
        else
          echo "**Status:** ❌ Failed - No backtest results generated" >> $GITHUB_STEP_SUMMARY
        fi
        
        # Show any error logs if they exist
        if [ -f error.log ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Errors:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -20 error.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi
