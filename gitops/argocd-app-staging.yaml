apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: conviction-ai-pipeline-staging
  namespace: argocd
  labels:
    app.kubernetes.io/name: conviction-ai-pipeline
    environment: staging
spec:
  project: default
  source:
    repoURL: 'https://github.com/your-org/conviction-ai-clean'
    targetRevision: develop
    path: charts/conviction-ai-pipeline
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: chaos.enabled
          value: "true"
        - name: chaos.etl.duration
          value: "10"
        - name: chaos.etl.percentAffected
          value: "1"
        - name: chaos.inference.duration
          value: "10"
        - name: chaos.inference.percentAffected
          value: "1"
        - name: backfill.enabled
          value: "false"
        - name: rollout.enabled
          value: "true"
        - name: alerts.enabled
          value: "true"
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
