# Template for creating secrets - DO NOT commit actual values
apiVersion: v1
kind: Secret
metadata:
  name: aws-credentials
  namespace: data-processing
type: Opaque
data:
  # Base64 encoded values - replace with actual credentials
  access-key-id: <base64-encoded-access-key>
  secret-access-key: <base64-encoded-secret-key>
---
apiVersion: v1
kind: Secret
metadata:
  name: slack-webhook
  namespace: data-processing
type: Opaque
data:
  # Base64 encoded webhook URL - replace with actual URL
  url: <base64-encoded-webhook-url>
