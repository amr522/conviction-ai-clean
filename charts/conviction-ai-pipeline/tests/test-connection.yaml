apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "conviction-ai-pipeline.fullname" . }}-test-connection"
  labels:
    {{- include "conviction-ai-pipeline.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "conviction-ai-pipeline.fullname" . }}:{{ .Values.service.port }}']