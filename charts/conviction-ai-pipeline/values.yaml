# Default values for conviction-ai-pipeline
replicaCount: 1

image:
  repository: conviction-ai-pipeline
  pullPolicy: IfNotPresent
  tag: "latest"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 2
    memory: 4Gi
  requests:
    cpu: 1
    memory: 2Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Pipeline configuration
runDate: ""
nTrials: 50
nJobs: 4

# Chaos engineering
chaos:
  enabled: false
  etl:
    duration: 60
    percentAffected: 20
  inference:
    duration: 60
    percentAffected: 10
  network:
    enabled: true
    duration: 60       # seconds
    latency: 200       # ms
    percentAffected: 20
  cpu:
    enabled: true
    duration: 60       # seconds
    load: 80           # percent CPU load per pod
    percentAffected: 20
  exporter:
    enabled: true
    image: litmuschaos/chaos-exporter:latest
    port: 9110

# Backfill configuration
backfill:
  enabled: false
  schedule: "0 2 * * *"
  workers: 8

# Persistence
persistence:
  enabled: true
  data:
    size: 50Gi
    storageClass: ""
  models:
    size: 10Gi
    storageClass: ""
  metrics:
    size: 5Gi
    storageClass: ""

# Prometheus alerts
alerts:
  enabled: true

# Alertmanager configuration
alertmanager:
  slackApiUrl: ""        # e.g. https://hooks.slack.com/services/XXX
  slackChannel: "#alerts"

# Argo Rollouts configuration
rollout:
  enabled: true
  canary:
    initialWeight: 10
    maxWeight: 100
    analysis:
      enabled: true

# Lineage Explorer UI
lineage:
  enabled: true
  host: "lineage.your-domain.com"
  servicePort: 80
  replicaCount: 1
  image:
    repository: your-registry/conviction-ai-lineage
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
  authSecret: "basic-auth-lineage"
  openlineageUrl: "http://localhost:5000"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
