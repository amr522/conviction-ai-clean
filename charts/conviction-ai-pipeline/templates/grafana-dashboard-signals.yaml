{{- if .Values.grafana.dashboard.signals.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "conviction-ai-pipeline.fullname" . }}-signals-dashboard
  labels:
    {{- include "conviction-ai-pipeline.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  signals.json: |
    {
      "dashboard": {
        "id": null,
        "title": "Signal Quality Dashboard",
        "tags": ["conviction-ai", "signals"],
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "type": "stat",
            "title": "Gamma Coverage",
            "gridPos": {"h": 8, "w": 8, "x": 0, "y": 0},
            "targets": [
              {
                "expr": "gamma_coverage{job=\"signal-validators\"}",
                "legendFormat": "Coverage"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "percentunit",
                "min": 0,
                "max": 1,
                "thresholds": {
                  "steps": [
                    {"color": "red", "value": 0},
                    {"color": "yellow", "value": 0.8},
                    {"color": "green", "value": 0.9}
                  ]
                }
              }
            }
          },
          {
            "id": 2,
            "type": "stat",
            "title": "Flow Accuracy",
            "gridPos": {"h": 8, "w": 8, "x": 8, "y": 0},
            "targets": [
              {
                "expr": "flow_accuracy{job=\"signal-validators\"}",
                "legendFormat": "Accuracy"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "percentunit",
                "min": 0,
                "max": 1,
                "thresholds": {
                  "steps": [
                    {"color": "red", "value": 0},
                    {"color": "yellow", "value": 0.8},
                    {"color": "green", "value": 0.9}
                  ]
                }
              }
            }
          },
          {
            "id": 3,
            "type": "stat",
            "title": "Volume Spike Detection",
            "gridPos": {"h": 8, "w": 8, "x": 16, "y": 0},
            "targets": [
              {
                "expr": "vol_spike_detection{job=\"signal-validators\"}",
                "legendFormat": "Detection Rate"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "percentunit",
                "min": 0,
                "max": 1,
                "thresholds": {
                  "steps": [
                    {"color": "red", "value": 0},
                    {"color": "yellow", "value": 0.8},
                    {"color": "green", "value": 0.9}
                  ]
                }
              }
            }
          }
        ],
        "time": {"from": "now-1h", "to": "now"},
        "refresh": "30s"
      }
    }
{{- end }}