{{- if .Values.lineage.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "conviction-ai-pipeline.fullname" . }}-lineage
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "conviction-ai-pipeline.labels" . | nindent 4 }}
    component: lineage
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/auth-type: "basic"
    nginx.ingress.kubernetes.io/auth-secret: "{{ .Values.lineage.authSecret }}"
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: {{ .Values.lineage.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "conviction-ai-pipeline.fullname" . }}-lineage
                port:
                  number: {{ .Values.lineage.servicePort }}
{{- end }}
