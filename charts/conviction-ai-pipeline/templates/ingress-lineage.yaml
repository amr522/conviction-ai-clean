{{- if .Values.lineage.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "conviction-ai.fullname" . }}-lineage
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "conviction-ai.labels" . | nindent 4 }}
    component: lineage
  annotations:
    kubernetes.io/ingress.class: nginx
    {{- if .Values.lineage.auth.oidc.enabled }}
    nginx.ingress.kubernetes.io/auth-url: "{{ .Values.lineage.auth.oidc.issuerUrl }}/protocol/openid-connect/auth?redirect_uri={{ .Values.lineage.auth.oidc.redirectUrl }}&client_id={{ .Values.lineage.auth.oidc.clientId }}&response_type=code&scope={{ .Values.lineage.auth.oidc.scope | replace " " "%20" }}"
    nginx.ingress.kubernetes.io/auth-signin: "{{ .Values.lineage.auth.oidc.redirectUrl }}"
    nginx.ingress.kubernetes.io/auth-response-headers: "Authorization, X-User, X-Email, X-Groups"
    nginx.ingress.kubernetes.io/auth-snippet: |
      auth_request_set $user $upstream_http_x_user;
      auth_request_set $email $upstream_http_x_email;
      proxy_set_header X-User $user;
      proxy_set_header X-Email $email;
    {{- else }}
    nginx.ingress.kubernetes.io/auth-type: "basic"
    nginx.ingress.kubernetes.io/auth-secret: "{{ .Values.lineage.authSecret }}"
    {{- end }}
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: {{ .Values.lineage.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "conviction-ai.fullname" . }}-lineage
                port:
                  number: {{ .Values.lineage.servicePort }}
{{- end }}
