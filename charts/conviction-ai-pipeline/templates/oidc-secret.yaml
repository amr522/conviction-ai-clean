{{- if and .Values.lineage.enabled .Values.lineage.auth.oidc.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "conviction-ai.fullname" . }}-oidc-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "conviction-ai.labels" . | nindent 4 }}
    component: lineage
type: Opaque
data:
  client-secret: {{ .Values.lineage.auth.oidc.clientSecret | b64enc }}
  client-id: {{ .Values.lineage.auth.oidc.clientId | b64enc }}
  issuer-url: {{ .Values.lineage.auth.oidc.issuerUrl | b64enc }}
{{- end }}
