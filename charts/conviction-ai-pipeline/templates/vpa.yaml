{{- if .Values.autoscaling.vpa.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "conviction-ai.fullname" . }}-vpa
  labels:
    {{- include "conviction-ai.labels" . | nindent 4 }}
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: {{ include "conviction-ai.fullname" . }}
  updatePolicy:
    updateMode: {{ .Values.autoscaling.vpa.updateMode | quote }}
  resourcePolicy:
    containerPolicies:
    - containerName: {{ .Chart.Name }}
      minAllowed:
        cpu: {{ .Values.autoscaling.vpa.minAllowed.cpu }}
        memory: {{ .Values.autoscaling.vpa.minAllowed.memory }}
      maxAllowed:
        cpu: {{ .Values.autoscaling.vpa.maxAllowed.cpu }}
        memory: {{ .Values.autoscaling.vpa.maxAllowed.memory }}
      controlledResources: ["cpu", "memory"]
{{- end }}